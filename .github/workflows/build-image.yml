name: Build image (nzws-flavored)

on:
  push:
    branches:
      - don.nzws.me-4.3.0

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    strategy:
      matrix:
        platforms: [linux/amd64, linux/arm64]
        image: [mastodon, mastodon-streaming]

    runs-on: ${{ matrix.platforms == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        id: buildx

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          file: ${{ matrix.image == 'mastodon' && 'Dockerfile' || 'streaming/Dockerfile' }}
          context: .
          build-args: |
            MASTODON_VERSION_METADATA=${{ github.sha }}
          platforms: ${{ matrix.platforms }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/nzws/${{ matrix.image }}:latest-${{ matrix.platforms == 'linux/arm64' && 'linux-arm64' || 'linux-amd64' }}
