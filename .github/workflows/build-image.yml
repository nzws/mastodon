name: Build image (nzws-flavored)

on:
  push:
    branches:
      - don.nzws.me-4.3.0

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/nzws/mastodon

jobs:
  build-image:
    strategy:
      matrix:
        platforms: [linux-amd64, linux-arm64]

    runs-on: ${{ matrix.platforms == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        id: buildx

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            MASTODON_VERSION_METADATA=${{ github.sha }}
          platforms: ${{ matrix.platforms }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY_IMAGE }}:latest-${{ matrix.platforms }}
