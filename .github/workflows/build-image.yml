name: Build image (nzws-flavored)

on:
  push:
    branches:
      - 'nzws/4.*'

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    strategy:
      matrix:
        platforms: [linux/amd64, linux/arm64]
        image: [mastodon, mastodon-streaming]

    runs-on: ${{ matrix.platforms == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        id: buildx

      - name: Read Mastodon version
        id: version
        run: |
          major=$(awk '/def major/{getline; print $1}' lib/mastodon/version.rb)
          minor=$(awk '/def minor/{getline; print $1}' lib/mastodon/version.rb)
          patch=$(awk '/def patch/{getline; print $1}' lib/mastodon/version.rb)
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          file: ${{ matrix.image == 'mastodon' && 'Dockerfile' || 'streaming/Dockerfile' }}
          context: .
          build-args: |
            MASTODON_VERSION_METADATA=${{ github.sha }}
          platforms: ${{ matrix.platforms }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/nzws/${{ matrix.image }}:${{ steps.version.outputs.tag }}-${{ matrix.platforms == 'linux/arm64' && 'linux-arm64' || 'linux-amd64' }}
